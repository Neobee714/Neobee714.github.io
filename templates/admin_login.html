<!DOCTYPE html>
<html lang="zh-CN" data-theme="lofi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台登录 - Neobee's Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center">
  <div class="card w-96 bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl font-bold text-center mb-4">🔐 后台登录</h2>
      
      {% if error %}
      <div class="alert alert-error mb-4">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}
      
      <form method="POST" action="/admin/login">
        <div class="form-control">
          <label class="label">
            <span class="label-text">管理员密码</span>
          </label>
          <input type="password" name="password" placeholder="请输入密码" 
                 class="input input-bordered" required autofocus>
        </div>
        
        <div class="form-control mt-6">
          <button type="submit" class="btn btn-primary">登录</button>
        </div>
      </form>
      
      <div class="divider"></div>
      
      <div class="text-center">
        <a href="/" class="link link-hover text-sm">← 返回首页</a>
      </div>
    </div>
  </div>
</body>
</html>
