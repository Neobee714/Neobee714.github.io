name: Sync Notion Data

on:
  schedule:
    - cron: '0 * * * *'  # 每小时整点运行
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Notion sync
        run: |
          curl -f "https://neobee.top/api/force_sync?token=${{ secrets.SYNC_TOKEN }}" || echo "Sync failed"
